<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% capture meta_title %}{% if page.section == "home" %}{{ site.title }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}{% endcapture %}
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ meta_title | strip | escape }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ meta_title | strip | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/og-cover.png' | absolute_url }}">
  <meta property="og:image:width" content="600">
  <meta property="og:image:height" content="315">
  <meta property="og:image:alt" content="扉のマークと『さいとーの部屋』の文字">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">本文へ移動</a>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">さいとーの部屋</a>
      <nav class="nav" aria-label="メインメニュー">
        <a href="{{ '/' | relative_url }}"{% if page.section == "home" %} aria-current="page"{% endif %}>ホーム</a>
        <a href="{{ '/diary.html' | relative_url }}"{% if page.section == "diary" %} aria-current="page"{% endif %}>日記</a>
        <a href="{{ '/music.html' | relative_url }}"{% if page.section == "music" %} aria-current="page"{% endif %}>音楽</a>
      </nav>
    </div>
  </header>
  <main id="main">
    {{ content }}
  </main>
  <footer class="footer wrap">
    <span>© さいとーの部屋</span>
    <span>気まぐれに更新中。</span>
  </footer>
</body>
</html>
